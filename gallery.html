<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - Frontier Football</title>
    <meta
      name="description"
      content="Every photograph and clip Frontier Football has shared, in one gallery."
    />

    <!-- Tab icon and link preview. Both were missing, so every shared link
         rendered as an untitled grey box and the tab showed a browser default.
         PNG and JPG rather than the .webp originals they were made from:
         Safari still refuses a webp favicon, and webp link previews are
         unreliable in WhatsApp, which is how this site actually gets passed
         around. public/favicon.png is crest.webp padded (not cropped) onto
         paper; public/og.jpg is the hero poster cropped to 1200x630.

         No og:url, and og:image is root-relative: the domain is still TODO and
         HOUSE-RULES section 7 forbids printing one the site does not have.
         ponytail: scrapers officially want an absolute og:image URL. Relative
         resolves against the document in current practice. Make it absolute
         the day the domain lands.

         ponytail: this whole block is hand-copied into gallery.html, the same
         drift risk the footer and the lightbox shell below already carry. Edit
         both or neither. -->
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gallery - Frontier Football" />
    <meta property="og:description" content="Every photograph and clip Frontier has shared, pulled into one gallery." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/hero.css" />
    <link rel="stylesheet" href="/src/styles/gallery-page.css" />
    <link rel="stylesheet" href="/src/styles/footer.css" />
  </head>
  <body>
    <!-- Same nav as the home page, with the one item swapped: this page offers
         the way back rather than the way here. hero.css carries .nav, which is
         why it is linked on a page with no hero. -->
    <header class="nav">
      <a class="nav__brand" href="/">
        <img
          class="nav__crest"
          src="/crest.webp"
          width="525"
          height="640"
          alt="Frontier Football"
          fetchpriority="high"
        />
      </a>

      <div class="nav__end">
        <a class="nav__link" href="/">Home</a>
        <a class="nav__link" href="/events.html">Events</a>
        <a class="nav__link" href="/collaborate.html">Collaborate</a>
        <a class="nav__link" href="/about.html">About</a>
      </div>
    </header>

    <main id="top">
      <!-- This page has no hero, so the headline here IS the top of the page and
           is set at display scale. On the home page the hero owns that job and
           every section below it stays quieter. -->
      <section class="gallery-page">
        <div class="gallery-page__head">
          <div>
            <p class="eyebrow gallery-page__eyebrow">Our stories</p>
            <h1 class="gallery-page__headline">Gallery</h1>
          </div>
          <p class="gallery-page__lede">
            Every photograph and clip Frontier has shared, pulled into one gallery.
          </p>
        </div>

        <!-- Built by src/gallery-page.js from content.js's seasons,
             competitions and watch-alongs - one tab each for 4x4 Series, Turf
             Wars, Division 0 and Watch Parties, each card opening its album or
             linking out to its Google Drive folder. See docs/HOUSE-RULES.md and
             CONTEXT.md. -->
        <div data-gallery-page></div>
      </section>
    </main>

    <!-- The same footer as the home page, hand-copied. This page has no green
         band, so the ink fill here is the only dark surface on it: chrome, not a
         second inversion. No marquee: the site has exactly one and it lives on
         the home page. No links hub either, which belongs to the single-scroll
         home page in BUILD-PROMPT's scope.

         ponytail: hand-copied, so it can drift from index.html. Named rather
         than engineered around, since a shared partial costs a build step this
         project does not have. -->
    <footer class="site-foot">
      <div class="site-foot__inner">
        <img
          class="site-foot__crest"
          src="/crest.webp"
          width="525"
          height="640"
          alt="Frontier Football"
          loading="lazy"
          decoding="async"
        />
        <p class="site-foot__line">
          Small-sided football and the culture around it, in Colombo.
        </p>
        <nav class="site-foot__nav" aria-label="Footer">
          <a class="site-foot__link" href="/">Home</a>
          <a class="site-foot__link" href="/collaborate.html">Collaborate</a>
          <a class="site-foot__link" href="/events.html">Events</a>
          <a class="site-foot__link" href="/about.html">About</a>
          <a class="site-foot__link" href="/gallery.html">Gallery</a>
          <a class="site-foot__link" href="/contact.html">Contact</a>
        </nav>
        <p class="site-foot__meta">&copy; Frontier Football</p>
      </div>
    </footer>

    <script type="module" src="/src/gallery-page.js"></script>
  </body>
</html>
