<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Album - Frontier Football</title>
    <meta
      name="description"
      content="Every photograph from one Frontier Football album."
    />

    <!-- Tab icon and link preview. Both were missing, so every shared link
         rendered as an untitled grey box and the tab showed a browser default.
         PNG and JPG rather than the .webp originals they were made from:
         Safari still refuses a webp favicon, and webp link previews are
         unreliable in WhatsApp, which is how this site actually gets passed
         around. public/favicon.png is crest.webp padded (not cropped) onto
         paper; public/og.jpg is the hero poster cropped to 1200x630.

         No og:url, and og:image is root-relative: the domain is still TODO and
         HOUSE-RULES section 7 forbids printing one the site does not have.
         ponytail: scrapers officially want an absolute og:image URL. Relative
         resolves against the document in current practice. Make it absolute
         the day the domain lands.

         ponytail: this whole block is hand-copied into gallery.html, the same
         drift risk the footer and the lightbox shell below already carry. Edit
         both or neither. -->
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Album - Frontier Football" />
    <meta property="og:description" content="Every photograph from one Frontier Football album." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://drive.google.com" />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/hero.css" />
    <link rel="stylesheet" href="/src/styles/album-page.css" />
    <link rel="stylesheet" href="/src/styles/lightbox.css" />
    <link rel="stylesheet" href="/src/styles/footer.css" />
  </head>
  <body>
    <!-- Same nav as the home page, with the one item swapped: this page offers
         the way back rather than the way here. hero.css carries .nav, which is
         why it is linked on a page with no hero. -->
    <header class="nav">
      <a class="nav__brand" href="/">
        <img
          class="nav__crest"
          src="/crest.webp"
          width="525"
          height="640"
          alt="Frontier Football"
          fetchpriority="high"
        />
      </a>

      <div class="nav__end">
        <a class="nav__link" href="/gallery.html">Gallery</a>
        <a class="nav__link" href="/events.html">Events</a>
        <a class="nav__link" href="/collaborate.html">Collaborate</a>
      </div>
    </header>

    <main id="top">
      <!-- This page has no hero, so the headline here IS the top of the page and
           is set at display scale. On the home page the hero owns that job and
           every section below it stays quieter. -->
      <!-- Built by src/album-page.js from ?album=<id> in the URL and the
           matching file in public/albums/, written by `npm run albums:sync`.
           Everything on this page is drawn there: the head as well as the
           grid, because an album whose manifest will not load must be able to
           replace the headline too rather than sit under the name of an album
           it failed to show. -->
      <section class="album-page">
        <div data-album-page></div>
      </section>
    </main>

    <!-- The same footer as the home page, hand-copied. This page has no green
         band, so the ink fill here is the only dark surface on it: chrome, not a
         second inversion. No marquee: the site has exactly one and it lives on
         the home page. No links hub either, which belongs to the single-scroll
         home page in BUILD-PROMPT's scope.

         ponytail: hand-copied, so it can drift from index.html. Named rather
         than engineered around, since a shared partial costs a build step this
         project does not have. -->
    <footer class="site-foot">
      <div class="site-foot__inner">
        <img
          class="site-foot__crest"
          src="/crest.webp"
          width="525"
          height="640"
          alt="Frontier Football"
          loading="lazy"
          decoding="async"
        />
        <p class="site-foot__line">
          Small-sided football and the culture around it, in Colombo.
        </p>
        <nav class="site-foot__nav" aria-label="Footer">
          <a class="site-foot__link" href="/">Home</a>
          <a class="site-foot__link" href="/collaborate.html">Collaborate</a>
          <a class="site-foot__link" href="/events.html">Events</a>
          <a class="site-foot__link" href="/gallery.html">Gallery</a>
          <a class="site-foot__link" href="/contact.html">Contact</a>
        </nav>
        <p class="site-foot__meta">&copy; Frontier Football</p>
      </div>
    </footer>

<!-- The lightbox. A native <dialog>, so the focus trap, Escape-to-close, the
         inertness of the page behind it and an untabbable closed state all come
         from the platform rather than from hand-rolled JS.

         role and aria-modal are implied by showModal() and set here anyway, so
         the contract is readable in the markup.

         It holds no <video> element. src/hero.js queries
         document.querySelectorAll("video[data-src]") across the whole document at
         import time, and a video sitting in this markup is the one element that
         query could reach. src/gallery.js builds it on demand instead. -->
    <dialog
      class="lightbox"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lightbox-title"
      data-lightbox
    >
      <h2 class="lightbox__sr" id="lightbox-title">Gallery</h2>
      <!-- Position, announced rather than printed. A keyboard user arrowing
           through needs to know when they have wrapped; nobody needs to read
           "3 / 15" stamped on the picture. -->
      <p class="lightbox__sr" aria-live="polite" data-lightbox-status></p>

      <div class="lightbox__frame" data-lightbox-frame></div>

      <div class="lightbox__controls">
        <button class="btn btn--secondary" type="button" data-lightbox-step="-1">Previous</button>
        <button class="btn btn--secondary" type="button" data-lightbox-step="1">Next</button>
      </div>
      <button class="btn btn--secondary lightbox__close" type="button" data-lightbox-close>
        Close
      </button>
    </dialog>

    <script type="module" src="/src/album-page.js"></script>
  </body>
</html>
